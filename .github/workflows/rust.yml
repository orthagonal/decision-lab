name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-lab
    steps:
      - name: Check out decision-lab
        uses: actions/checkout@v4
        with:
          path: decision-lab
      - name: Check out jev-local
        uses: actions/checkout@v4
        with:
          repository: orthagonal/jev-local
          # Keep the gateway API aligned with tests/jev_local.rs.
          ref: 3ffcc93ec8b2c4ff34655f4983694a7f5fb861c6
          path: jev-local
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test
